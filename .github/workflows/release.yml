name: Package extension
on:
  release:
    types: [published]
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm run build
      - run: sha256sum scroll-words-extension.zip > SHA256SUMS.txt
        working-directory: dist
      - run: gh release upload "$RELEASE_TAG" dist/scroll-words-extension.zip dist/SHA256SUMS.txt
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
